<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Checkout - Frontend</title>

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-md navbar-dark sticky-top bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#" onclick="showPage('home'); return false;">
        Unified Checkout
      </a>
      <span class="navbar-text text-light">
        <small>Standalone Frontend</small>
      </span>
    </div>
  </nav>

  <!-- Main Content -->
  <main role="main" class="container">
    <div id="app-content">
      <!-- Dynamic content will be rendered here -->
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3">Initializing application...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer mt-auto py-3 bg-light">
    <div class="container text-center">
      <span class="text-muted">
        CyberSource Unified Checkout Demo |
        Backend: <a href="https://localhost:3000" target="_blank">https://localhost:3000</a>
      </span>
    </div>
  </footer>

  <!-- API Client -->
  <script src="js/api.js"></script>

  <!-- Main Application -->
  <script src="js/app.js"></script>
</body>
</html>
